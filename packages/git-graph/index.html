<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#141414" />
    <title>Git Graph</title>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        display: flex;
        flex-direction: column;
        background: #141414;
        color: #f2f2f2;
        font-family: Segoe UI, sans-serif;
      }
      #boot {
        flex-shrink: 0;
        padding: 12px 16px;
        background: #2a2a2a;
        border-bottom: 2px solid #6b8cff;
        font-size: 14px;
      }
      #root {
        flex: 1;
        min-height: 0;
      }
    </style>
  </head>
  <body>
    <div id="boot">Git Graph — if this is all you see, open http://127.0.0.1:5199 in Chrome or Edge.</div>
    <div id="root"></div>
    <script>
      window.addEventListener("error", function (event) {
        var boot = document.getElementById("boot")
        if (boot) boot.textContent = "Git Graph error: " + event.message
      })
      window.addEventListener("unhandledrejection", function (event) {
        var boot = document.getElementById("boot")
        if (boot) boot.textContent = "Git Graph error: " + String(event.reason)
      })
    </script>
    <script type="module" src="/src/standalone/main.tsx"></script>
  </body>
</html>
